server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Injection API -> injection backend. Strip the /injection prefix,
    # matching the Vite dev rewrite (^/api/injection -> /api).
    location /api/injection/ {
        rewrite ^/api/injection/(.*)$ /api/$1 break;
        proxy_pass http://injection-backend:8100;
        proxy_set_header Host $host;
    }

    # Capture / timeline / findings / context analysis -> main backend.
    # proxy_buffering off keeps the SSE stream (/api/stream) flowing.
    location /api/ {
        proxy_pass http://main-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
